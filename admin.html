<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JIRRA Admin</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f1eee8;color:#111}.wrap{max-width:980px;margin:auto;padding:42px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{font-size:clamp(44px,8vw,76px);margin:0}.panel{background:#fff;padding:28px;margin-top:24px;border-radius:14px}.panel h2{font-size:clamp(30px,5vw,44px);margin-top:0}label{display:block;font-weight:800;margin:18px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #c9c6c0;border-radius:8px;font:inherit;background:#fff}textarea{min-height:150px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.publish,.login-btn{margin-top:20px;background:#111;color:#fff;border:0;padding:14px 20px;font-weight:800;border-radius:8px;cursor:pointer}.publish:disabled{opacity:.5}.admin-msg{margin:18px 0;padding:12px 14px;border-radius:8px;background:#e8e5df}.admin-msg:empty{display:none}.admin-msg.bad{background:#ffe0e0}.admin-msg.ok{background:#e4f5e7}.preview img,.preview video{max-width:360px;max-height:280px;margin-top:12px;border-radius:10px}.content-row{padding:16px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:20px;align-items:center}.content-row strong,.content-row small{display:block}.content-row small{margin-top:4px;color:#666}.status{display:inline-block;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:.08em;padding:4px 7px;border-radius:999px;margin-right:8px;background:#ddd}.status.published{background:#d9f2de}.row-actions{display:flex;gap:8px}.row-actions button{border:1px solid #aaa;background:#fff;padding:8px 10px;border-radius:7px;cursor:pointer}.row-actions .danger{color:#a00}.account{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.account button{background:none;border:1px solid #aaa;padding:8px 10px;border-radius:7px}.login-card{max-width:480px;margin:80px auto;background:#fff;padding:32px;border-radius:14px}.login-card h1{font-size:52px;margin:0 0 8px}@media(max-width:650px){.grid2{grid-template-columns:1fr}.content-row{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div id="msg" class="admin-msg"></div>
<section id="loginView" class="login-card"><p class="eyebrow red">PRIVATE CONTENT AREA</p><h1>JIRRA ADMIN</h1><p>Approved admins only.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="login-btn">Sign in</button></form><p style="margin-top:20px"><a href="/">← Back to jirraa.com</a></p></section>
<section id="adminView" hidden><div class="top"><div><p class="eyebrow red">CONTENT STUDIO</p><h1>JIRRA ADMIN</h1></div><div class="account"><span id="adminEmail"></span><button id="logout">Sign out</button><a href="/">View website ↗</a></div></div>
<section class="panel"><h2>Create content</h2><form id="contentForm"><div class="grid2"><div><label>Content type</label><select id="type"><option>Blog</option><option>Poster</option><option>Event</option><option>Culture</option><option>Football</option><option>Community</option></select></div><div><label>Publish status</label><select id="status"><option value="published">Publish now</option><option value="draft">Save draft</option></select></div></div><label>Title</label><input id="title" required placeholder="Irreechaa 2027"><label>Short description</label><input id="excerpt" placeholder="A short line shown on the homepage"><label>Photo / poster / video</label><input id="file" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"><div id="preview" class="preview"></div><div class="grid2"><div><label>Event date (optional)</label><input id="eventDate" type="date"></div><div><label>Event location (optional)</label><input id="eventLocation" placeholder="Washington, DC"></div></div><label>Story / details</label><textarea id="body" placeholder="Write the story, announcement, event details or match update…"></textarea><button id="publishBtn" class="publish">Save content</button></form></section>
<section class="panel"><h2>Content</h2><div id="contentList"></div></section></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="admin.js"></script></body></html>
